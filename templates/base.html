<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VPS地域限速管理器{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        {% if current_user.is_authenticated %}
        <nav class="navbar navbar-dark bg-dark fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="{{ url_for('dashboard') }}">
                    <i class="bi bi-speedometer2 me-2"></i>VPS地域限速管理器
                </a>
                <div class="d-flex align-items-center gap-2">
                    <div class="dropdown">
                        <button class="btn btn-sm btn-outline-warning dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-key me-1"></i>改密
                        </button>
                        <div class="dropdown-menu dropdown-menu-end p-3" style="width:280px">
                            <input type="password" class="form-control form-control-sm mb-2" id="nav_old_password" placeholder="原密码">
                            <input type="password" class="form-control form-control-sm mb-2" id="nav_new_password" placeholder="新密码">
                            <input type="password" class="form-control form-control-sm mb-2" id="nav_confirm_password" placeholder="确认新密码">
                            <button class="btn btn-warning btn-sm w-100" onclick="navChangePassword()">确认修改</button>
                        </div>
                    </div>
                    <span class="text-light"><i class="bi bi-person-circle me-1"></i>{{ current_user.username }}</span>
                    <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">退出</a>
                </div>
            </div>
        </nav>
        {% endif %}
        
        <main class="main-content {% if not current_user.is_authenticated %}login-page{% endif %}">{% block content %}{% endblock %}</main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    function navChangePassword() {
        const o = document.getElementById('nav_old_password').value;
        const n = document.getElementById('nav_new_password').value;
        const c = document.getElementById('nav_confirm_password').value;
        if (!o||!n) { alert('请填写原密码和新密码'); return; }
        if (n!==c) { alert('两次新密码不一致'); return; }
        if (n.length<6) { alert('新密码至少6位'); return; }
        fetch('/api/change_password', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({old_password:o,new_password:n}) })
        .then(r=>r.json()).then(d=>{
            if (d.success) { alert('密码已修改，请重新登录'); window.location.href='/logout'; }
            else alert(d.message);
        }).catch(e=>alert('请求失败: '+e.message));
    }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
